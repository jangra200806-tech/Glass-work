      <stop offset="0.42" stop-color="#080A0E"/>
      <stop offset="0.72" stop-color="#10151B"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="rgBodySheen" cx="0.28" cy="0.18" r="0.92">
      <stop offset="0" stop-color="#7C8794" stop-opacity="0.52"/>
