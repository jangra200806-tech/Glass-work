<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Premium black and gold friendly AI assistant robot">
  <defs>
    <linearGradient id="rgBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343B45"/>
