<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img" aria-label="MAA MANSA DEVI GLASS WORKS">
  <defs>
    <linearGradient id="gwBlue" x1="9" y1="6" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48B8D8"/>
      <stop offset="0.55" stop-color="#1685D4"/>
      <stop offset="1" stop-color="#0E6BA8"/>
    </linearGradient>
    <linearGradient id="gwPane" x1="10" y1="10" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1685D4" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gwShine" x1="18" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="gwTextShadow" x="-8%" y="-30%" width="116%" height="170%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.9" flood-color="#0B2038" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Compact shield icon -->
  <g transform="translate(2 8)">
    <path d="M32 4.5 L9 12.5 V30.5 C9 43.9 18.6 53.6 32 59.5 C45.4 53.6 55 43.9 55 30.5 V12.5 Z"
          fill="url(#gwPane)" stroke="url(#gwBlue)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M32 6.5 V50 M10.4 30 H53.6" fill="none" stroke="url(#gwBlue)"
          stroke-width="1.9" stroke-linecap="round" opacity="0.9"/>
    <path d="M18.5 45 L45.5 18.5" fill="none" stroke="url(#gwShine)"
          stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="41" cy="22.5" r="5.4" fill="#0E6BA8" fill-opacity="0.18"
