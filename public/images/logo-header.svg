    <circle cx="41" cy="22.5" r="1.7" fill="#FFFFFF"/>
    <circle cx="22" cy="42" r="2.1" fill="#D4A017"/>
  </g>

  <!-- Compact brand text -->
  <g filter="url(#gwTextShadow)">
    <text x="78" y="40" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
          font-size="36" font-weight="700" letter-spacing="0.3" fill="#FFFFFF"
          stroke="#102D4F" stroke-width="1.9" paint-order="stroke fill">MAA MANSA</text>
    <text x="79" y="64" font-family="Arial, Helvetica, sans-serif"
